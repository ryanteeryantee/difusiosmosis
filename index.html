<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Laboratorium Virtual: Transpor Zat</title>
    <style>
        body { font-family: sans-serif; background: #eef2f3; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .grid { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; transition: all 0.3s; }
        .fullscreen { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #eef2f3; z-index: 9999; display: flex; align-items: center; justify-content: center; }
        
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; width: 400px; }
        
        .container-osmosis { display: flex; align-items: flex-end; height: 150px; border-bottom: 5px solid #2c3e50; margin: 10px auto; position: relative; width: 80%; overflow: hidden; border-left: 2px solid #2c3e50; border-right: 2px solid #2c3e50; }
        .membran { width: 10px; background: #95a5a6; height: 100%; position: absolute; left: 50%; transform: translateX(-50%); border-left: 1px dashed #333; border-right: 1px dashed #333; z-index: 2; }
        
        .air { background: #3498db; width: 50%; transition: height 5s ease-in-out; }
        canvas { background: white; border: 2px solid #333; margin-top: 10px; width: 100%; height: 150px; }
        button { padding: 10px; cursor: pointer; border: none; border-radius: 5px; background: #34495e; color: white; margin-top: 10px; }
        .slider-container { margin-top: 15px; }
    </style>
</head>
<body>

<h1>Laboratorium Virtual: Transpor Zat</h1>
<button onclick="toggleFullScreen()">Toggle Full Screen</button>
<br>

<div id="mainGrid" class="grid">
    <div class="card">
        <h3>Osmosis</h3>
        <div class="container-osmosis">
            <div class="membran"></div>
            <div id="airA" class="air" style="height: 50%;"></div>
            <div id="airB" class="air" style="height: 50%;"></div>
        </div>
        <select id="selectA"><option value="hipo">Hipotonis</option><option value="hiper">Hipertonis</option></select>
        <select id="selectB"><option value="hipo">Hipotonis</option><option value="hiper">Hipertonis</option></select>
        <br><button onclick="prosesOsmosis()">Jalankan Osmosis</button>
    </div>

    <div class="card">
        <h3>Difusi</h3>
        <canvas id="canvasDifusi" width="400" height="150"></canvas>
        <div class="slider-container">
            <label>Suhu: </label>
            <input type="range" id="suhuSlider" min="1" max="10" step="0.1" value="1">
        </div>
        <br><button onclick="resetDifusi()">Reset Difusi</button>
    </div>
</div>

<script>
    function toggleFullScreen() {
        const elem = document.getElementById("mainGrid");
        if (!document.fullscreenElement) {
            elem.classList.add('fullscreen');
            elem.requestFullscreen().catch(err => alert(`Error: ${err.message}`));
        } else {
            document.exitFullscreen();
            elem.classList.remove('fullscreen');
        }
    }

    // Logika Osmosis
    function prosesOsmosis() {
        let A = document.getElementById('selectA').value;
        let B = document.getElementById('selectB').value;
        let airA = document.getElementById('airA');
        let airB = document.getElementById('airB');
        if (A === 'hipo' && B === 'hiper') { airA.style.height = "20%"; airB.style.height = "80%"; }
        else if (A === 'hiper' && B === 'hipo') { airA.style.height = "80%"; airB.style.height = "20%"; }
        else { airA.style.height = "50%"; airB.style.height = "50%"; }
    }

    // Logika Difusi
    const canvas = document.getElementById("canvasDifusi");
    const ctx = canvas.getContext("2d");
    const suhuSlider = document.getElementById("suhuSlider");
    let particles = [];
    
    function resetDifusi() {
        particles = [];
        for(let i=0; i<50; i++) {
            particles.push({
                x: 200 + (Math.random()*20-10), 
                y: 75 + (Math.random()*20-10), 
                vx: (Math.random()-0.5), 
                vy: (Math.random()-0.5)
            });
        }
    }

    function animate() {
        ctx.clearRect(0, 0, 400, 150);
        let suhu = parseFloat(suhuSlider.value);
        
        particles.forEach(p => {
            // Kecepatan dipengaruhi oleh suhu
            p.x += p.vx * suhu; 
            p.y += p.vy * suhu;
            
            if(p.x < 0 || p.x > 400) p.vx *= -1;
            if(p.y < 0 || p.y > 150) p.vy *= -1;
            
            ctx.fillStyle = "#e67e22";
            ctx.beginPath(); 
            ctx.arc(p.x, p.y, 3, 0, Math.PI*2); 
            ctx.fill();
        });
        requestAnimationFrame(animate);
    }
    
    resetDifusi();
    animate();
</script>
</body>
</html>
